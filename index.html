<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Inventario – Telemetría</title>
  <!-- Bootstrap CSS via CDN for responsive design -->
  <!-- Cargamos Bootstrap desde CDN sin atributos de integridad para evitar bloqueos al cargar desde file:// -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="py-3 mb-4 border-bottom">
    <div class="container">
      <h1 class="text-center">Sistema de Inventario – Telemetría</h1>
    </div>
  </header>

  <main class="container mb-5">
    <!-- Action buttons -->
    <div class="d-flex flex-wrap gap-2 mb-4">
      <button id="addItemBtn" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i>Agregar ítem
      </button>
      <button id="addResponsableBtn" class="btn btn-secondary">
        <i class="bi bi-person-plus me-1"></i>Agregar responsable
      </button>
      <button id="printBtn" class="btn btn-outline-primary">
        <i class="bi bi-printer me-1"></i>Imprimir
      </button>
      <button id="saveDataBtn" class="btn btn-outline-success">
        <i class="bi bi-save me-1"></i>Guardar base de datos
      </button>
      <button id="configPathBtn" class="btn btn-outline-info">
        <i class="bi bi-folder2-open me-1"></i>Configurar ruta de datos
      </button>
    </div>

    <!-- Filters -->
    <div class="row g-3 align-items-end mb-4">
      <div class="col-12 col-md-4">
        <label for="categoryFilter" class="form-label">Filtrar por categoría</label>
        <select id="categoryFilter" class="form-select">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label for="fechaIngresoDesde" class="form-label">Ingreso desde</label>
        <input type="date" id="fechaIngresoDesde" class="form-control" />
      </div>
      <div class="col-6 col-md-2">
        <label for="fechaIngresoHasta" class="form-label">Ingreso hasta</label>
        <input type="date" id="fechaIngresoHasta" class="form-control" />
      </div>
      <div class="col-6 col-md-2">
        <label for="fechaModDesde" class="form-label">Modificación desde</label>
        <input type="date" id="fechaModDesde" class="form-control" />
      </div>
      <div class="col-6 col-md-2">
        <label for="fechaModHasta" class="form-label">Modificación hasta</label>
        <input type="date" id="fechaModHasta" class="form-control" />
      </div>
    </div>

    <!-- Inventory table -->
    <div class="table-responsive">
      <table id="inventoryTable" class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Categoría</th>
            <th scope="col">Material</th>
            <th scope="col">Cantidad</th>
            <th scope="col">Costo Unitario</th>
            <th scope="col">Costo Total</th>
            <th scope="col">Observaciones</th>
            <th scope="col">Responsable</th>
            <th scope="col">Marca</th>
            <th scope="col">Modelo</th>
            <th scope="col">Fecha de ingreso</th>
            <th scope="col">Fecha de modificación</th>
            <th scope="col">Foto</th>
            <th scope="col" class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Modal for adding/editing items -->
  <div
    class="modal fade"
    id="itemModal"
    tabindex="-1"
    aria-labelledby="itemModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <form id="itemForm">
          <div class="modal-header">
            <h5 class="modal-title" id="itemModalLabel">Nuevo ítem</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="itemId" />
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="itemCategory" class="form-label">Categoría</label>
                <input
                  list="categoryList"
                  class="form-control"
                  id="itemCategory"
                  placeholder="Ej. Cable, Sensor..."
                  required
                />
                <datalist id="categoryList"></datalist>
              </div>
              <div class="col-sm-6">
                <label for="itemMaterial" class="form-label">Material</label>
                <input type="text" class="form-control" id="itemMaterial" required />
              </div>
              <div class="col-sm-4">
                <label for="itemQuantity" class="form-label">Cantidad</label>
                <input
                  type="number"
                  class="form-control"
                  id="itemQuantity"
                  min="0"
                  step="1"
                  required
                />
              </div>
              <div class="col-sm-4">
                <label for="itemCostUnit" class="form-label">Costo unitario (₡)</label>
                <input
                  type="number"
                  class="form-control"
                  id="itemCostUnit"
                  min="0"
                  step="0.01"
                  required
                />
              </div>
              <div class="col-sm-4">
                <label for="itemCostTotal" class="form-label">Costo total (₡)</label>
                <input
                  type="text"
                  class="form-control"
                  id="itemCostTotal"
                  disabled
                />
              </div>
              <div class="col-sm-6">
                <label for="itemResponsable" class="form-label">Responsable</label>
                <div class="input-group">
                  <select id="itemResponsable" class="form-select" required></select>
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    id="quickAddResponsable"
                  >
                    <i class="bi bi-plus-lg"></i>
                  </button>
                </div>
              </div>
              <div class="col-sm-3">
                <label for="itemMarca" class="form-label">Marca</label>
                <input type="text" class="form-control" id="itemMarca" />
              </div>
              <div class="col-sm-3">
                <label for="itemModelo" class="form-label">Modelo</label>
                <input type="text" class="form-control" id="itemModelo" />
              </div>
              <div class="col-12">
                <label for="itemObservaciones" class="form-label">Observaciones</label>
                <textarea class="form-control" id="itemObservaciones" rows="2"></textarea>
              </div>
              <div class="col-12">
                <label for="itemPhoto" class="form-label">Foto (opcional)</label>
                <input type="file" class="form-control" id="itemPhoto" accept="image/*" />
                <div class="mt-2">
                  <img id="photoPreview" src="" alt="Previsualización" style="max-width: 150px; display: none;" />
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal for adding responsables -->
  <div
    class="modal fade"
    id="responsableModal"
    tabindex="-1"
    aria-labelledby="responsableModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="responsableForm">
          <div class="modal-header">
            <h5 class="modal-title" id="responsableModalLabel">Agregar responsable</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="responsableNombre" class="form-label">Nombre completo</label>
              <input
                type="text"
                class="form-control"
                id="responsableNombre"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />
  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
  <!-- Application logic -->
  <script src="script.js"></script>

  <!-- Hidden file input for configuring data path -->
  <input type="file" id="dataFileInput" accept=".txt,application/json" style="display: none;" />
</body>
</html>
