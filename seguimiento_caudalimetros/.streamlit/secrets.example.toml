[app]
demo_mode = false
# En Streamlit Cloud use "supabase". Dentro de la red AyA puede usar "sql".
# "auto" usa Supabase si está configurado; de lo contrario intenta SQL.
data_source = "supabase"
password = ""

[sql]
# SQL se usa al ejecutar localmente dentro de AyA y para el sincronizador.
server = "SERVIDOR_SQL_INTERNO"
database = "GIS_RME"
username = "USUARIO_SQL"
password = "CONTRASENA_SQL"
driver = "ODBC Driver 13 for SQL Server"
schema = "AYA"
table = "MSG_Medidores_de_Caudal"
key_field = "Código_Caudalimetro"

[supabase]
url = "https://TU-PROYECTO.supabase.co"
service_role_key = "SERVICE_ROLE_KEY_SOLO_EN_SERVIDOR"
table = "caudalimetro_revisiones"
meters_table = "caudalimetros"
bucket = "caudalimetros-graficos"
